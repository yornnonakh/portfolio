name: portfolio
description: "A considered Flutter portfolio, powered by Riverpod."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/profile_photo.jpg
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
